
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moshkin Invest</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      text-align: center;
    }
    main { padding: 30px; max-width: 600px; }
    h1 { font-size: 42px; }
    p { color: #bdc8d8; line-height: 1.6; }
    button {
      background: #c59a43;
      color: #101827;
      border: 0;
      padding: 18px 28px;
      font-size: 17px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    #video { display: none; margin-top: 25px; }
    iframe { width: 100%; aspect-ratio: 16/9; border: 0; }
  </style>
</head>
<body>
  <main>
    <h1>MOSHKIN INVEST</h1>
    <p>Курс по управлению личными финансами и инвестированию.</p>
    <p>Максимально просто и доступно.</p>

    <button onclick="startVideo()">
      НАЧАТЬ ИНВЕСТИРОВАТЬ
    </button>

    <div id="video">
      <iframe
        src=""
        title="Rick Astley music video"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
  </main>

<script>
  function startVideo() {
    const video = document.querySelector("#video");
    const iframe = video?.querySelector("iframe");

    if (!video || !iframe) {
      console.error("Video container or iframe not found");
      return;
    }

    video.style.display = "block";

    iframe.src =
      "https://vk.com/video_ext.php?oid=-1980&id=456246417&autoplay=1&mute=0";
  }
</script>
</body>
</html>
